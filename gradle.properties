org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.1.0+1.21.11
maven_group=com.glamardor
archives_base_name=flashback-inspector

# Dependencies
fabric_api_version=0.141.6+1.21.11
cloth_config_version=19.0.147
modmenu_version=15.0.2

# Flashback is compiled against, never shipped. The jar in libs/ is the mod's own classes with
# the bundled ffmpeg and the native blobs taken out, so that Loom has something small to remap.
# Only the handful of entry points this mod calls is used, and every one of them has been in
# Flashback since 0.39.0: Flashback.RECORDER, Recorder.writePacketAsync, Recorder.writeCustomSnapshot,
# Flashback.isInReplay, Flashback.getSpectatingPlayer, ReplayServer.goToReplayTick.
flashback_jar=flashback-0.39.10-1.21.11-api.jar
